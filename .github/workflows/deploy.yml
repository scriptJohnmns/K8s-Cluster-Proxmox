name: Deploy Proxmox K8s Cluster

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
      TF_VAR_proxmox_user: ${{ secrets.PROXMOX_USER }}
      TF_VAR_proxmox_password: ${{ secrets.PROXMOX_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_node_name: ${{ secrets.PROXMOX_NODE_NAME }}
      TF_VAR_node_address: ${{ secrets.PROXMOX_NODE_ADDRESS }}
      TF_VAR_base_template_id: ${{ secrets.BASE_TEMPLATE_ID }}
      TF_VAR_network_gateway: ${{ secrets.NETWORK_GATEWAY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Terraform
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Setup Kubespray Environment and Deploy
        run: |
          # 1. Cria o ambiente virtual Python
          python3 -m venv .venv-kubespray

          # 2. Ativa o ambiente virtual
          source .venv-kubespray/bin/activate

          # 3. Instala as dependências do Kubespray (Ansible, etc.)
          pip3 install -r kubespray/requirements.txt

          # 4. Cria o arquivo temporário com a chave SSH privada
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ansible-key.pem
          chmod 600 /tmp/ansible-key.pem
          
          # 5. Executa o playbook do Kubespray
          ansible-playbook kubespray/cluster.yml \
            -i inventory.ini \
            --become \
            --private-key /tmp/ansible-key.pem \
            -u ubuntu

          # 6. Limpa o arquivo de chave temporário
          rm /tmp/ansible-key.pem