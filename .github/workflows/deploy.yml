#E isso aqui
name: Deploy Proxmox K8s Cluster

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
      TF_VAR_proxmox_user: ${{ secrets.PROXMOX_USER }}
      TF_VAR_proxmox_password: ${{ secrets.PROXMOX_PASSWORD }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Deploy Kubernetes with Kubespray
        run: |
          source .venv-kubespray/bin/activate
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ansible-key.pem
          chmod 600 /tmp/ansible-key.pem
          ansible-playbook kubespray/cluster.yml -i inventory.ini --become --private-key /tmp/ansible-key.pem -u ubuntu
          rm /tmp/ansible-key.pem
